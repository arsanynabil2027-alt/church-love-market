<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق المحبة الكنسي | ركن البركة والمقتنيات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .gradient-header { background: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%); }
        .card-hover { transition: all 0.25s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.12); }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- شريط علوي -->
    <header class="gradient-header text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <!-- النقر المزدوج على شعار الحمامة يفتح بوابة الأدمن السرية -->
            <div class="flex items-center gap-3 cursor-pointer select-none" id="adminTrigger" title="انقر مرتين لبوابة الإدارة السرية">
                <div class="bg-amber-400 text-slate-900 p-2 rounded-xl font-extrabold text-xl shadow">🕊️</div>
                <div>
                    <h1 class="text-lg md:text-xl font-extrabold flex items-center gap-2">
                        سوق المحبة الكنسي
                        <span class="bg-emerald-500/20 border border-emerald-400/40 text-emerald-200 text-xs px-2 py-0.5 rounded-full">بدون أسماء لرفع الحرج</span>
                    </h1>
                    <p class="text-xs text-blue-200">منصة سرية لتبادل المقتنيات والبركة داخل مجتمع الكنيسة</p>
                </div>
            </div>

            <!-- الهوية + زر النشر -->
            <div class="flex items-center gap-2 flex-wrap">
                <div class="bg-white/10 border border-white/20 px-3 py-1.5 rounded-xl flex items-center gap-2 text-xs md:text-sm">
                    <span class="text-amber-300">🎭 هويتك:</span>
                    <strong id="userAliasDisplay" class="text-white font-bold">عضو #...</strong>
                    <button id="regenAliasBtn" class="hover:text-amber-300 underline text-xs mr-1">تغيير</button>
                </div>

                <button id="openAddModalBtn" class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold px-3.5 py-2 rounded-xl text-xs md:text-sm shadow transition flex items-center gap-1">
                    <span>➕</span> أضف غرضاً أو طلباً
                </button>
            </div>
        </div>
    </header>

    <!-- الأقسام والبحث -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
            <div class="flex flex-wrap gap-2" id="categoryButtons">
                <button data-cat="all" class="cat-btn bg-indigo-900 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm">الكل</button>
                <button data-cat="للبيع" class="cat-btn bg-white hover:bg-slate-100 text-slate-700 border px-4 py-2 rounded-xl text-sm font-semibold">🏷️ للبيع بسعر رمزي</button>
                <button data-cat="مجاني" class="cat-btn bg-white hover:bg-slate-100 text-emerald-700 border px-4 py-2 rounded-xl text-sm font-semibold">🎁 هدية محبة (مجاني)</button>
                <button data-cat="مطلوب" class="cat-btn bg-white hover:bg-slate-100 text-amber-700 border px-4 py-2 rounded-xl text-sm font-semibold">🔍 مطلوب شراؤه</button>
            </div>

            <div class="relative w-full md:w-72">
                <input id="searchInput" type="text" placeholder="ابحث عن جهاز، أثاث..." class="w-full pl-3 pr-9 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-indigo-600 bg-white">
                <span class="absolute right-3 top-2.5 text-slate-400">🔍</span>
            </div>
        </div>

        <!-- شبكة المعروضات -->
        <div id="itemsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </main>

    <!-- نافذة إضافة غرض -->
    <div id="addModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-extrabold text-lg text-indigo-950">➕ إضافة غرض أو طلب جديد</h3>
                <button class="close-modal-btn text-slate-400 hover:text-slate-700 font-bold" data-modal="addModal">✕</button>
            </div>
            <div class="space-y-3 text-sm">
                <div>
                    <label class="block font-bold mb-1 text-slate-700">نوع الإعلان:</label>
                    <select id="newType" class="w-full border rounded-xl p-2.5 bg-slate-50 font-semibold">
                        <option value="للبيع">🏷️ معروض للبيع بسعر رمزي</option>
                        <option value="مجاني">🎁 هدية محبة (مجاني تماماً)</option>
                        <option value="مطلوب">🔍 مطلوب شراؤه</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold mb-1 text-slate-700">اسم الغرض:</label>
                    <input id="newTitle" type="text" placeholder="مثال: ميكروويف أو كتب دراسية..." class="w-full border rounded-xl p-2.5">
                </div>
                <div>
                    <label class="block font-bold mb-1 text-slate-700">السعر (أو اكتب مجاني):</label>
                    <input id="newPrice" type="text" placeholder="مثال: 200 ج.م أو مجاني" class="w-full border rounded-xl p-2.5">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="font-bold text-slate-700">التفاصيل والحالة:</label>
                        <button type="button" id="neutralizeBtn" class="text-xs bg-indigo-100 hover:bg-indigo-200 text-indigo-800 px-2 py-0.5 rounded font-bold">🪄 صياغة ذكية محايدة</button>
                    </div>
                    <textarea id="newDesc" rows="3" placeholder="تفاصيل الغرض..." class="w-full border rounded-xl p-2.5"></textarea>
                </div>
                <button id="submitNewItemBtn" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-bold py-3 rounded-xl shadow mt-2">نشر الإعلان فوراً</button>
            </div>
        </div>
    </div>

    <!-- نافذة تسجيل دخول الأدمن -->
    <div id="adminLoginModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center">
            <h3 class="font-extrabold text-lg text-indigo-950 mb-3">🔐 بوابة إدارة النظام</h3>
            <p class="text-xs text-slate-600 mb-4">أدخل كلمة المرور الخاصة بك كأدمن:</p>
            <input id="adminPasswordInput" type="password" placeholder="أدخل كلمة المرور..." class="w-full border rounded-xl p-2.5 text-sm mb-3 text-center font-bold">
            <div class="flex gap-2">
                <button id="verifyAdminBtn" class="flex-grow bg-indigo-900 text-white font-bold py-2 rounded-xl text-sm">دخول</button>
                <button class="close-modal-btn bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-bold" data-modal="adminLoginModal">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- لوحة تحكم الأدمن (Dashboard) -->
    <div id="adminDashboardModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl max-h-[95vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-extrabold text-lg text
