<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق المحبة الكنسي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- شريط علوي -->
    <header class="bg-indigo-900 text-white shadow-lg p-4 sticky top-0 z-30">
        <div class="max-w-5xl mx-auto flex justify-between items-center flex-wrap gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-amber-400 text-slate-900 p-2 rounded-xl font-bold text-lg">🕊️</div>
                <div>
                    <h1 class="text-lg font-extrabold">سوق المحبة الكنسي</h1>
                    <p class="text-xs text-blue-200">منصة سرية لتبادل المقتنيات والبركة</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span class="bg-white/10 px-3 py-1.5 rounded-xl text-xs">🎭 هويتك: <b id="userAlias" class="text-amber-300">عضو #...</b></span>
                <button id="openModalBtn" class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold px-4 py-2 rounded-xl text-xs shadow">➕ أضف غرضاً</button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-5xl mx-auto p-4 flex-grow w-full">
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
            <button onclick="filterCat('all')" class="cat-btn bg-indigo-900 text-white px-4 py-2 rounded-xl text-xs font-bold">الكل</button>
            <button onclick="filterCat('للبيع')" class="cat-btn bg-white border text-slate-700 px-4 py-2 rounded-xl text-xs font-bold">🏷️ للبيع بسعر رمزي</button>
            <button onclick="filterCat('مجاني')" class="cat-btn bg-white border text-emerald-700 px-4 py-2 rounded-xl text-xs font-bold">🎁 هدية محبة (مجاني)</button>
            <button onclick="filterCat('مطلوب')" class="cat-btn bg-white border text-amber-700 px-4 py-2 rounded-xl text-xs font-bold">🔍 مطلوب شراؤه</button>
        </div>

        <div id="itemsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </main>

    <!-- نافذة الإضافة -->
    <div id="addModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <h3 class="font-extrabold text-base text-indigo-950">➕ إضافة غرض أو طلب جديد</h3>
            <select id="itemType" class="w-full border p-2.5 rounded-xl text-xs font-bold bg-slate-50">
                <option value="للبيع">🏷️ للبيع بسعر رمزي</option>
                <option value="مجاني">🎁 هدية محبة (مجاني)</option>
                <option value="مطلوب">🔍 مطلوب شراؤه</option>
            </select>
            <input id="itemTitle" type="text" placeholder="اسم الغرض (مثال: شاشة أو لابتوب)..." class="w-full border p-2.5 rounded-xl text-xs">
            <input id="itemPrice" type="text" placeholder="السعر (مثال: رمزى أو مجاني)..." class="w-full border p-2.5 rounded-xl text-xs">
            <textarea id="itemDesc" rows="3" placeholder="التفاصيل..." class="w-full border p-2.5 rounded-xl text-xs"></textarea>
            <div class="flex gap-2">
                <button id="saveItemBtn" class="flex-grow bg-indigo-900 hover:bg-indigo-800 text-white font-bold py-2.5 rounded-xl text-xs">نشر الآن</button>
                <button id="closeModalBtn" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- الكود البرمجي للتطبيق -->
    <script>
        let alias = localStorage.getItem('alias') || 'عضو #' + Math.floor(100 + Math.random() * 900);
        localStorage.setItem('alias', alias);
        document.getElementById('userAlias').innerText = alias;

        let items = JSON.parse(localStorage.getItem('market_data')) || [
            { id: 1, type: 'للبيع', title: 'شاشة سمارت 43 بوصة', price: 'سعر رمزي', desc: 'استعمال خفيف بحالة ممتازة.', owner: 'عضو #412', icon: '📺' },
            { id: 2, type: 'مجاني', title: 'سرير أطفال خشب زان', price: 'مجاني تماماً', desc: 'هدية محبة لأي أسرة محتاجة.', owner: 'عضو #809', icon: '🛏️' },
            { id: 3, type: 'مطلوب', title: 'لابتوب للدراسة', price: 'ميزانية بسيطة', desc: 'مطلوب جهاز بحالة جيدة للمذاكرة.', owner: 'عضو #215', icon: '💻' }
        ];

        let activeCat = 'all';

        function render() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';
            
            const filtered = items.filter(i => activeCat === 'all' || i.type === activeCat);

            if(filtered.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-slate-400 py-10 font-bold">لا توجد إعلانات في هذا القسم حالياً..</p>';
                return;
            }

            filtered.forEach(i => {
                grid.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl border shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-3xl">${i.icon || '📦'}</span>
                                <span class="bg-slate-100 text-slate-700 text-[10px] font-bold px-2.5 py-1 rounded-full">${i.type}</span>
                            </div>
                            <h3 class="font-extrabold text-sm text-slate-900 mb-1">${i.title}</h3>
                            <p class="text-xs text-slate-500 leading-relaxed mb-4">${i.desc}</p>
                        </div>
                        <div class="border-t pt-3 flex justify-between items-center text-xs">
                            <span class="text-slate-400">الناشر: <b>${i.owner}</b></span>
                            <span class="bg-indigo-50 text-indigo-900 font-extrabold px-2.5 py-1 rounded-lg">${i.price}</span>
                        </div>
                    </div>`;
            });
        }

        window.filterCat = function(cat) {
            activeCat = cat;
            render();
        }

        render();

        const modal = document.getElementById('addModal');
        document.getElementById('openModalBtn').onclick = () => modal.classList.remove('hidden') || modal.classList.add('flex');
        document.getElementById('closeModalBtn').onclick = () => modal.classList.add('hidden');

        document.getElementById('saveItemBtn').onclick = () => {
            let type = document.getElementById('itemType').value;
            let title = document.getElementById('itemTitle').value.trim();
            let price = document.getElementById('itemPrice').value.trim() || 'رمزى';
            let desc = document.getElementById('itemDesc').value.trim() || 'بدون تفاصيل إضافية.';

            if(!title) return alert('يرجى كتابة اسم الغرض');

            let icon = type === 'مجاني' ? '🎁' : (type === 'مطلوب' ? '🔍' : '🏷️');

            items.unshift({ id: Date.now(), type, title, price, desc, owner: alias, icon });
            localStorage.setItem('market_data', JSON.stringify(items));
            
            modal.classList.add('hidden');
            document.getElementById('itemTitle').value = '';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemDesc').value = '';
            render();
            alert('✨ تم نشر إعلانك بنجاح!');
        };
    </script>
</body>
</html>
