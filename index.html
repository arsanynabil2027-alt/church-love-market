<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق المحبة الكنسي | ركن البركة والمقتنيات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .gradient-header { background: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%); }
        .card-hover { transition: all 0.25s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.12); }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- شريط علوي -->
    <header class="gradient-header text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3 cursor-pointer select-none" id="adminTrigger" title="بوابة الإدارة السرية">
                <div class="bg-amber-400 text-slate-900 p-2 rounded-xl font-extrabold text-xl shadow">🕊️</div>
                <div>
                    <h1 class="text-lg md:text-xl font-extrabold flex items-center gap-2">
                        سوق المحبة الكنسي
                        <span class="bg-emerald-500/20 border border-emerald-400/40 text-emerald-200 text-xs px-2 py-0.5 rounded-full">بدون أسماء لرفع الحرج</span>
                    </h1>
                    <p class="text-xs text-blue-200">منصة سرية لتبادل المقتنيات والبركة داخل مجتمع الكنيسة</p>
                </div>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <div class="bg-white/10 border border-white/20 px-3 py-1.5 rounded-xl flex items-center gap-2 text-xs md:text-sm">
                    <span class="text-emerald-300">🙏 بركات المجتمع:</span>
                    <strong id="blessingsCounter" class="text-amber-300 font-extrabold">14</strong>
                </div>

                <div class="bg-white/10 border border-white/20 px-3 py-1.5 rounded-xl flex items-center gap-2 text-xs md:text-sm">
                    <span class="text-amber-300">🎭 هويتك:</span>
                    <strong id="userAliasDisplay" class="text-white font-bold">عضو #...</strong>
                    <button id="regenAliasBtn" class="hover:text-amber-300 underline text-xs mr-1">تغيير</button>
                </div>

                <button id="openAddModalBtn" class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold px-3.5 py-2 rounded-xl text-xs md:text-sm shadow transition flex items-center gap-1">
                    <span>➕</span> أضف غرضاً أو طلباً
                </button>
            </div>
        </div>
    </header>

    <!-- شريط إرشادي سري -->
    <section class="bg-indigo-50 border-b border-indigo-100 py-2 px-4 text-xs text-indigo-900">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
            <span>💡 منصة مجتمعية آمنة لتبادل البركة والمقتنيات بكل خصوصية وسرية.</span>
        </div>
    </section>

    <!-- الأقسام والبحث -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
            <div class="flex flex-wrap gap-2" id="categoryButtons">
                <button data-cat="all" class="cat-btn bg-indigo-900 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm">الكل</button>
                <button data-cat="للبيع بسعر رمزي" class="cat-btn bg-white hover:bg-slate-100 text-slate-700 border px-4 py-2 rounded-xl text-sm font-semibold">🏷️ للبيع بسعر رمزي</button>
                <button data-cat="هدية محبة (مجاني)" class="cat-btn bg-white hover:bg-slate-100 text-emerald-700 border px-4 py-2 rounded-xl text-sm font-semibold">🎁 هدية محبة (مجاني)</button>
                <button data-cat="مطلوب شراؤه" class="cat-btn bg-white hover:bg-slate-100 text-amber-700 border px-4 py-2 rounded-xl text-sm font-semibold">🔍 مطلوب شراؤه</button>
            </div>

            <div class="relative w-full md:w-72">
                <input id="searchInput" type="text" placeholder="ابحث عن جهاز، أثاث..." class
